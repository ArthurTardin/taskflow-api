info:
  name: Listar tarefas por período
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/api/tarefas/periodo?dataInicio=2026-10-01&dataFim=2026-10-31
  params:
    - name: dataInicio
      value: 2026-10-01
      type: query
    - name: dataFim
      value: 2026-10-31
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
